<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Relatório · KCOM</title>
  <link rel="icon" type="image/png" href="/images/logo-branca.png">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="report">
  <main class="rep-wrap">
    <div class="rep-bar" id="bar">
      <div class="rep-period">
        <select id="mode" aria-label="Tipo de período"><option value="month">Mês</option><option value="range">Período</option><option value="day">Data específica</option></select>
        <input type="month" id="month" aria-label="Mês">
        <label id="rangeBox" class="hidden">De <input type="date" id="from"> até <input type="date" id="to"></label>
        <input type="date" id="day" class="hidden" aria-label="Data">
      </div>
      <button class="btn primary" id="print" type="button">Imprimir / Salvar PDF</button>
    </div>
    <div id="report"></div>
    <section class="panel" id="live" style="margin-top:16px"></section>
    <p class="muted rep-foot">Relatório gerado automaticamente · KCOM</p>
  </main>
  <script type="module" src="/assets/report.js?v=3"></script>
</body>
</html>
